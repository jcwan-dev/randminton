<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Randminton – New session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#134631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F3; color: #12201A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 24px 20px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12201A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="17" r="3"></circle><path d="M9 15l9-9"></path><path d="M14 4l6 6"></path><path d="M16 5l-2 5 5-2"></path></svg>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Randminton</span>
    </div>
    <span style="font-size: 13px; color: #4F6158">New session</span>
  </header>

  <main style="flex: 1; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #DDE3DE">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <label for="courts" style="font-weight: 600; font-size: 16px">Courts</label>
        <span style="font-size: 13px; color: #4F6158">4 players per court</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <button aria-label="Remove a court" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #C9D2CC; background: #F4F6F3; font-size: 22px; color: #12201A">−</button>
        <input id="courts" value="4" style="width: 52px; height: 44px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; border: none; background: transparent; color: #12201A">
        <button aria-label="Add a court" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #1F6B4A; color: #FFFFFF; font-size: 22px">+</button>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 18px; border: 1px solid #DDE3DE; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="add" style="font-weight: 600; font-size: 16px">Players</label>
        <span style="font-size: 13px; color: #4F6158">24 added · 12 F · 12 M</span>
      </div>
      <div style="display: flex; gap: 8px">
        <input id="add" placeholder="Name" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D2CC; font-family: inherit; font-size: 15px; background: #F4F6F3">
        <div role="group" aria-label="Sex" style="display: flex; border: 1px solid #C9D2CC; border-radius: 12px; overflow: hidden; flex: none">
          <button aria-pressed="true" aria-label="Female" style="width: 44px; height: 42px; border: none; background: #12201A; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">F</button>
          <button aria-pressed="false" aria-label="Male" style="width: 44px; height: 42px; border: none; border-left: 1px solid #C9D2CC; background: #F4F6F3; color: #12201A; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px">M</button>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: none; background: #1F6B4A; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; flex: none">Add</button>
      </div>
      <span style="font-size: 12px; color: #4F6158; line-height: 1.4">Or paste a list, one per line as <strong style="font-weight: 600; color: #12201A">name,sex</strong>, e.g. Ana,F</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; max-height: 168px; overflow: hidden">
        <sc-for list="{{players}}" as="p" hint-placeholder-count="24">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 6px; border-radius: 999px; background: #E9EEEA; font-size: 14px">
            <span style="width: 20px; height: 20px; border-radius: 999px; box-sizing: border-box; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none">{{p.sex}}</span>{{p.name}}<button aria-label="Remove player" style="width: 24px; height: 24px; border: none; background: transparent; color: #4F6158; font-size: 15px; padding: 0">×</button>
          </span>
        </sc-for>
      </div>
      <a href="PastPlayers.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 14px; border-radius: 12px; border: 1px solid #C9D2CC; background: #F4F6F3; color: #12201A; text-decoration: none; font-size: 14px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5a6.5 6.5 0 0 1 3 5.5"></path></svg>
        <span style="flex: 1">Pick from past players</span>
        <span style="font-size: 13px; font-weight: 500; color: #4F6158">31 saved</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F6158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #1F6B4A; color: #FFFFFF; border-radius: 16px; padding: 12px 16px">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">16</div>
        <div style="font-size: 13px; opacity: 0.9">on court first round</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #DDE3DE; border-radius: 16px; padding: 12px 16px">
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">8</div>
        <div style="font-size: 13px; color: #4F6158">waiting · max wait 3 games</div>
      </div>
    </section>
  </main>

  <footer style="padding: 14px 20px 28px">
    <a href="Live.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: {{accent}}; color: #12201A; text-decoration: none; font-weight: 600; font-size: 17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.2"></circle><circle cx="15.5" cy="15.5" r="1.2"></circle><circle cx="15.5" cy="8.5" r="1.2"></circle><circle cx="8.5" cy="15.5" r="1.2"></circle></svg>
      Randomise first games
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#FFC94D","#7FD8F0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const roster = 'Ana F,Ben M,Chloé F,Dev M,Eli M,Fatima F,Gus M,Hana F,Ivo M,Jade F,Kai M,Lena F,Marco M,Nina F,Omar M,Pia F,Quentin M,Rosa F,Sami M,Tara F,Uma F,Victor M,Wen F,Xavier M';
    const badge = sex => sex === 'F'
      ? { bg: '#12201A', fg: '#FFFFFF', bd: '#12201A' }
      : { bg: '#FFFFFF', fg: '#12201A', bd: '#8A9A91' };
    return {
      accent: this.props.accent ?? '#C6F24E',
      players: roster.split(',').map(s => {
        const [name, sex] = s.split(' ');
        return { name, sex, ...badge(sex) };
      })
    };
  }
}
</script>
</body>
</html>
