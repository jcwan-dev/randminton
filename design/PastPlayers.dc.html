<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Randminton – Pick past players</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#134631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #7D8781; color: #12201A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding-top: 44px">
  <div role="dialog" aria-label="Pick from past players" style="flex: 1; min-height: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 40px; height: 4px; border-radius: 999px; background: #C9D2CC"></span></div>

    <header style="padding: 6px 12px 0 20px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Past players</span>
        <span style="font-size: 13px; color: #4F6158">31 saved · sex remembered</span>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #12201A">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </a>
    </header>

    <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <div style="position: relative">
        <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search past players</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F6158" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="search" placeholder="Search names" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 40px; border-radius: 12px; border: 1px solid #C9D2CC; font-family: inherit; font-size: 15px; background: #F4F6F3">
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #12201A; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Recent first</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #C9D2CC; background: #FFFFFF; color: #12201A; font-family: inherit; font-size: 13px; font-weight: 500">Most played</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #C9D2CC; background: #FFFFFF; color: #12201A; font-family: inherit; font-size: 13px; font-weight: 500">A–Z</button>
      </div>
      <button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D2CC; background: #EEF9D2; color: #12201A; font-family: inherit; font-size: 14px; font-weight: 600; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        <span style="flex: 1">Select everyone from last session</span>
        <span style="font-size: 13px; font-weight: 500; color: #4F6158">Thu 23 Oct · 24</span>
      </button>
    </div>

    <div style="padding: 14px 20px 6px; display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #4F6158">Tap to add</h2>
      <span style="font-size: 12px; color: #4F6158">18 selected · 9 F · 9 M</span>
    </div>

    <ul style="list-style: none; margin: 0 20px; padding: 0; flex: 1; min-height: 0; overflow: hidden; border: 1px solid #DDE3DE; border-radius: 16px">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="10">
        <li style="border-bottom: 1px solid #E9EEEA">
          <button aria-pressed="{{p.sel}}" style="width: 100%; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border: none; background: {{p.rowBg}}; font-family: inherit; color: #12201A; text-align: left">
            <span style="width: 22px; height: 22px; border-radius: 6px; box-sizing: border-box; border: 2px solid {{p.boxBd}}; background: {{p.boxBg}}; display: inline-flex; align-items: center; justify-content: center; flex: none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{p.tick}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </span>
            <span style="width: 20px; height: 20px; border-radius: 999px; box-sizing: border-box; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none">{{p.sex}}</span>
            <span style="flex: 1; font-size: 15px; font-weight: {{p.weight}}">{{p.name}}</span>
            <span style="font-size: 12px; color: #4F6158">{{p.meta}}</span>
          </button>
        </li>
      </sc-for>
    </ul>

    <footer style="padding: 14px 20px 28px; display: flex; flex-direction: column; gap: 8px">
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #1F6B4A; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px">Add 18 players</a>
      <span style="font-size: 12px; color: #4F6158; text-align: center">New names typed on the session screen are saved here automatically.</span>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (s, sel, meta) => {
      const [name, sex] = s.split(' ');
      const badge = sex === 'F'
        ? { bg: '#12201A', fg: '#FFFFFF', bd: '#12201A' }
        : { bg: '#FFFFFF', fg: '#12201A', bd: '#8A9A91' };
      return {
        name, sex, meta, ...badge,
        sel: sel ? 'true' : 'false',
        rowBg: sel ? '#F3FBE3' : '#FFFFFF',
        boxBg: sel ? '#1F6B4A' : '#FFFFFF',
        boxBd: sel ? '#1F6B4A' : '#8A9A91',
        tick: sel ? '#FFFFFF' : 'transparent',
        weight: sel ? 600 : 400
      };
    };
    return {
      players: [
        p('Ana F', true, '23 Oct · 14×'),
        p('Ben M', true, '23 Oct · 12×'),
        p('Chloé F', true, '23 Oct · 9×'),
        p('Dev M', false, '23 Oct · 11×'),
        p('Eli M', true, '23 Oct · 6×'),
        p('Fatima F', true, '23 Oct · 13×'),
        p('Gus M', true, '23 Oct · 8×'),
        p('Hana F', false, '23 Oct · 4×'),
        p('Yara F', false, '16 Oct · 3×'),
        p('Bruno M', false, '2 Oct · 1×')
      ]
    };
  }
}
</script>
</body>
</html>
